# Dataset de evaluación — Tarea A (criterios de aceptación de RutaSIT).
# El comportamiento esperado se escribió ANTES de ejecutar cualquier prompt (E1).
# Las historias salen del Product Backlog del proyecto (requisitos RF-01 a RF-06 de
# docs/architecture/drivers.md y HU-01 de docs/design/historia.md).
- description: "H1 normal: consultar el tiempo de llegada (HU-01 / RF-03)"
  vars:
    id: H1
    historia: "Como pasajero, quiero consultar el tiempo estimado de llegada del bus a mi paradero para decidir si lo espero o busco otra ruta."
    caso: normal
    esperado: "Escenarios de éxito (ETA visible) y de error o borde (bus sin señal por más de 30 s)."
  assert:
    - type: javascript                  # A2: historia valida -> al menos un exito y un error o borde
      metric: A2_exito_y_error
      value: |
        let j; try { j = JSON.parse(output); } catch (e) { return false; }
        const t = (j.escenarios || []).map(e => e.tipo);
        return j.invest_ok === true && t.includes('exito') && (t.includes('error') || t.includes('borde'));

