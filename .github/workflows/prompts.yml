name: prompts
on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
permissions:
  contents: read
jobs:
  evals:
    # Los borradores pueden esperar aportes previos del equipo.
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"          # promptfoo 0.125.1 exige node >= 22.22.0
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt
      - name: Instalar promptfoo (respeta el lockfile)
        working-directory: prompts
        run: npm ci
      - name: Pruebas del generador y de toda la suite
        run: PYTHONPATH=src pytest -q test
      - name: Evals con respuestas grabadas (sin API key)
        working-directory: prompts
        env:
          PROMPTFOO_DISABLE_TELEMETRY: "1"
        run: |
          # promptfoo sale con 100 cuando fallan aserciones (v1 y v2 son linea base y fallan a proposito).
          # Cualquier otro codigo es un error de ejecucion y detiene el job.
          for carpeta in criterios pruebas-eta seguridad; do
            rm -f "$carpeta/resultados.json"          # nunca leer un reporte viejo
            rc=0
            npx promptfoo eval -c "$carpeta/promptfooconfig.yaml" --no-cache -o "$carpeta/resultados.json" || rc=$?
            if [ "$rc" -ne 0 ] && [ "$rc" -ne 100 ]; then echo "promptfoo fallo con codigo $rc en $carpeta"; exit "$rc"; fi
            test -s "$carpeta/resultados.json"
          done
      - name: Plantillas y grabaciones sin cambios sin registrar
        run: python3 prompts/procedencia.py verificar
      - name: Exigir 100 % en las versiones vigentes (todas las versiones y casos, sin errores)
        run: |
          python3 prompts/resumen_resultados.py prompts/criterios/resultados.json --exigir v5
          python3 prompts/resumen_resultados.py prompts/pruebas-eta/resultados.json --exigir v3.2
          python3 prompts/resumen_resultados.py prompts/seguridad/resultados.json --exigir v3,v4,v5
