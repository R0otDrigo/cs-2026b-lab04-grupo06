name: agentes
on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
permissions:
  contents: read
jobs:
  agentes:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt
      - name: Pruebas de los issues (después de aprobar los cambios del agente)
        run: pytest -q tests
      - name: Pruebas del agente y reproducción de las 6 corridas grabadas
        working-directory: agentes
        run: python -m pytest -q pruebas_agente
      - name: Servidor MCP (Lab 11) - contrato, adaptador, auditor y corrida grabada
        run: python -m pytest -q agentes/mcp/pruebas
      - name: Auditoría del catálogo propio (falla si hay hallazgos ALTA)
        working-directory: agentes/mcp
        run: python cliente/auditar.py servidor_mcp/rutasit_mcp.py
