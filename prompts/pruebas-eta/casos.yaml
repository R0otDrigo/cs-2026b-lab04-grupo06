# Dataset de evaluacion - Tarea B (pruebas pytest para la funcion de tiempo de llegada).
# El codigo de cada caso se extrae de src/rutasit con construir_casos.py.
# El comportamiento esperado se escribio ANTES de ejecutar los prompts.
- description: 'B1 normal: EtaPorVelocidad.estimar'
  vars:
    id: B1
    caso: normal
    modulo: rutasit.eta
    funcion: EtaPorVelocidad.estimar
    codigo: |
      from rutasit.gps import Posicion  # Posicion(lat, lon, vel_kmh)
      class EtaPorVelocidad(EstrategiaEta):
          def estimar(self, pos, paradero):
              return round(1.0 * 60 / max(pos.vel_kmh, 5.0))
    api: Posicion(lat, lon, vel_kmh) es un dataclass inmutable de rutasit.gps. EtaPorVelocidad() se crea
      sin argumentos (rutasit.eta). El paradero es un texto.
    esperado: Casos de velocidad normal, alta y baja (menor de 5 km/h usa 5 km/h como piso); minutos enteros.
- description: 'B2 normal: ConCacheEta'
  vars:
    id: B2
    caso: normal
    modulo: rutasit.eta
    funcion: ConCacheEta
    codigo: |
      class ConCacheEta(EstrategiaEta):
          """Solo guarda respuestas EXITOSAS (si la interna falla, nada se guarda)."""

          def __init__(self, interna: EstrategiaEta):
              self._interna, self._cache = interna, {}

          def estimar(self, pos, paradero):
              clave = (round(pos.lat, 3), round(pos.lon, 3), paradero)
              if clave not in self._cache:
                  self._cache[clave] = self._interna.estimar(pos, paradero)
              return self._cache[clave]
    api: EstrategiaEta es una clase abstracta de rutasit.eta con el metodo estimar(pos, paradero). Para
      probar ConCacheEta, crea una clase falsa que herede de EstrategiaEta y cuente sus llamadas. Posicion(lat,
      lon, vel_kmh) esta en rutasit.gps.
    esperado: Prueba que la segunda llamada con la misma posicion no vuelve a llamar a la estrategia interna,
      y que un fallo no se guarda.
- description: 'B3 normal: ConRespaldo'
  vars:
    id: B3
    caso: normal
    modulo: rutasit.eta
    funcion: ConRespaldo
    codigo: |
      class ConRespaldo(EstrategiaEta):
          """Si la principal agota sus reintentos, usa la estrategia de respaldo."""

          def __init__(self, principal: EstrategiaEta, respaldo: EstrategiaEta):
              self._principal, self._respaldo = principal, respaldo

          def estimar(self, pos, paradero):
              try:
                  return self._principal.estimar(pos, paradero)
              except TimeoutError:
                  return self._respaldo.estimar(pos, paradero)
    api: EstrategiaEta es una clase abstracta de rutasit.eta con el metodo estimar(pos, paradero). Usa
      clases falsas que hereden de EstrategiaEta; la principal puede lanzar TimeoutError. Posicion(lat,
      lon, vel_kmh) esta en rutasit.gps.
    esperado: Usa el respaldo solo ante TimeoutError; otros errores se propagan.
- description: 'B4 normal: EtaPorMapas'
  vars:
    id: B4
    caso: normal
    modulo: rutasit.eta
    funcion: EtaPorMapas
    codigo: |
      class ProveedorMapas(ABC):
          @abstractmethod
          def tiempo_de_recorrido(self, origen, destino) -> int:
              """Segundos de recorrido."""

      class EtaPorMapas(EstrategiaEta):
          def __init__(self, mapas: ProveedorMapas):
              self._mapas = mapas

          def estimar(self, pos, paradero):
              return round(self._mapas.tiempo_de_recorrido((pos.lat, pos.lon), paradero) / 60)
    api: ProveedorMapas es abstracta (rutasit.eta) con tiempo_de_recorrido(origen, destino) que devuelve
      SEGUNDOS. Crea un proveedor falso sin red que herede de ProveedorMapas. Posicion(lat, lon, vel_kmh)
      esta en rutasit.gps.
    esperado: Convierte segundos a minutos redondeados; usa un proveedor de mapas falso (sin red).
- description: 'B5 normal: ConReintentosEta'
  vars:
    id: B5
    caso: normal
    modulo: rutasit.eta
    funcion: ConReintentosEta
    codigo: |
      class ConReintentosEta(EstrategiaEta):
          def __init__(self, interna: EstrategiaEta, intentos: int = 3):
              self._interna, self._intentos = interna, intentos

          def estimar(self, pos, paradero):
              for i in range(self._intentos):
                  try:
                      return self._interna.estimar(pos, paradero)
                  except TimeoutError:
                      if i == self._intentos - 1:
                          raise
    api: ConReintentosEta(interna, intentos=3). Crea una estrategia falsa que herede de EstrategiaEta
      (rutasit.eta) y lance TimeoutError las veces que haga falta. Posicion(lat, lon, vel_kmh) esta en
      rutasit.gps.
    esperado: Reintenta hasta 3 veces ante TimeoutError y re-lanza el ultimo error; no reintenta otros
      errores.
- description: 'B6 normal: ServicioEta.consultar_eta'
  vars:
    id: B6
    caso: normal
    modulo: rutasit.servicio
    funcion: ServicioEta.consultar_eta
    codigo: |
      # El constructor de ServicioEta ya trae GPS, mapas y LLM simulados (rutasit.externos).
      # Viaje(id, placa, operador, estado='PROGRAMADO') esta en rutasit.servicio.
          def consultar_eta(self, viaje, paradero, algoritmo="MAPAS"):
              viaje.verificar_eta()
              gps = self.fabrica_gps.crear(viaje.operador)
              estrategia = self.fabrica_eta.crear(algoritmo)
              pos = gps.leer(viaje.placa)
              if pos is None:
                  self.publicador.publicar("sin_senal", {"id": viaje.id})
                  return Estimacion(0, False)
              viaje.posiciones.append(pos)
              minutos = estrategia.estimar(pos, paradero)
              datos = {"id": viaje.id, "paradero": paradero, "minutos": minutos}
              self.publicador.publicar("eta_calculado", datos)
              if minutos > LIMITE_RETRASO_MIN:
                  self.publicador.publicar("retraso_detectado", datos)
              return Estimacion(minutos, True)
    api: 'Se importa asi: from rutasit.servicio import ServicioEta, Viaje. Viaje(id, placa, operador,
      estado=''PROGRAMADO''); los estados son PROGRAMADO, EN_RUTA, DESVIADO, DETENIDO y FINALIZADO; viaje.iniciar()
      pasa de PROGRAMADO a EN_RUTA, y consultar_eta lanza ValueError si el viaje no esta EN_RUTA. ServicioEta()
      se crea sin argumentos y trae simulados: GpsOperadorA(fallas=0, vel_kmh=30.0), GpsOperadorB(fallas=0,
      codigo=200, vel_ms=5.0) y MapasOSM(fallas=0, segundos=300), todos de rutasit.externos; ServicioEta(gps_a=...,
      gps_b=..., mapas=...) acepta reemplazos. El operador del viaje es ''A'' o ''B''. Algoritmos: ''MAPAS''
      y ''VELOCIDAD''. El resultado es un objeto con los atributos minutos y disponible. servicio.eventos
      es una lista de textos, por ejemplo ''alerta:<id>:retraso'' o ''alerta:<id>:sin senal''.'
    esperado: ETA disponible para un viaje EN_RUTA; evento de retraso si pasa de 20 minutos; sin senal
      devuelve disponible=False.
- description: 'B7 borde: EstadoViaje.verificar_eta (State)'
  vars:
    id: B7
    caso: borde
    modulo: rutasit.estados
    funcion: EstadoViaje.verificar_eta (State)
    codigo: |
      class Programado(EstadoViaje):
          nombre = "PROGRAMADO"

          def iniciar(self, viaje): viaje.cambiar_a(EnRuta())
          def verificar_eta(self, viaje): raise ValueError("El viaje aun no inicia")

      class EnRuta(EstadoViaje):
          nombre = "EN_RUTA"

          def marcar_desviado(self, viaje): viaje.cambiar_a(Desviado())
          def marcar_detenido(self, viaje): viaje.cambiar_a(Detenido())
          def finalizar(self, viaje): viaje.cambiar_a(Finalizado())
          def verificar_eta(self, viaje): return None

      class Finalizado(EstadoViaje):
          nombre = "FINALIZADO"

          def verificar_eta(self, viaje): raise ValueError("El viaje ya finalizo")
    api: 'Las clases estan en rutasit.estados. El Viaje real es rutasit.servicio.Viaje(id, placa, operador,
      estado=''PROGRAMADO'') y su metodo verificar_eta() delega en el estado: lanza ValueError con ''El
      viaje aun no inicia'' (PROGRAMADO) o ''El viaje ya finalizo'' (FINALIZADO) y no devuelve nada (None)
      si esta EN_RUTA. viaje.iniciar() pasa de PROGRAMADO a EN_RUTA y viaje.finalizar() de EN_RUTA a FINALIZADO.'
    esperado: Un viaje PROGRAMADO o FINALIZADO no puede consultar su ETA (ValueError); EN_RUTA si.
