name: Validar y regenerar diagramas

"on":
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: arquitectura-diagramas-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mermaid:
    name: Validar workspace C4 y regenerar vistas
    runs-on: ubuntu-latest

    steps:
      - name: Obtener el codigo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Instalar mermaid-cli
        run: npm install -g @mermaid-js/mermaid-cli

      - name: Preparar Puppeteer para CI
        run: echo '{"args":["--no-sandbox","--disable-setuid-sandbox"]}' > puppeteer.json

      - name: Descargar Structurizr CLI
        run: docker pull structurizr/cli:1.31.0

      - name: Validar workspace C4
        run: |
          set -euo pipefail
          workspace="docs/architecture/c4/workspace.dsl"
          test -f "$workspace"
          if ! output="$(docker run --rm \
            -v "$GITHUB_WORKSPACE:/workspace" \
            structurizr/cli:1.31.0 \
            validate -workspace "/workspace/$workspace" 2>&1)"; then
            printf '%s\n' "$output"
            exit 1
          fi
          if [ -n "$output" ]; then
            printf '%s\n' "$output"
            echo "::error::Structurizr encontró errores en $workspace"
            exit 1
          fi
          echo "Workspace C4 válido: $workspace"

      - name: Exportar las vistas C4
        run: |
          set -euo pipefail
          workspace="/workspace/docs/architecture/c4/workspace.dsl"
          output="/workspace/docs/architecture/c4/export"
          mkdir -p docs/architecture/c4/export
          mkdir -p docs/architecture/c4/img
          find docs/architecture/c4/export -maxdepth 1 -type f \
            \( -name 'structurizr-*.puml' -o -name 'structurizr-*.mmd' \) -delete
          find docs/architecture/c4/img -maxdepth 1 -type f \
            \( -name 'structurizr-*.png' -o -name 'structurizr-*-mermaid.png' \) -delete
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/workspace" \
            structurizr/cli:1.31.0 \
            export -workspace "$workspace" -format plantuml -output "$output"
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/workspace" \
            structurizr/cli:1.31.0 \
            export -workspace "$workspace" -format mermaid -output "$output"
          find docs/architecture/c4/export -maxdepth 1 -type f -name '*-key.puml' -delete
          plantuml_views="$(find docs/architecture/c4/export -maxdepth 1 -type f \
            -name 'structurizr-*.puml' ! -name '*-key.puml' | wc -l)"
          mermaid_views="$(find docs/architecture/c4/export -maxdepth 1 -type f \
            -name 'structurizr-*.mmd' | wc -l)"
          if [ "$plantuml_views" -ne 5 ] || [ "$mermaid_views" -ne 5 ]; then
            echo "::error::Se esperaban cinco vistas C4 por formato; PlantUML=$plantuml_views, Mermaid=$mermaid_views"
            exit 1
          fi

      - name: Regenerar imágenes C4 de PlantUML
        run: |
          set -euo pipefail
          mkdir -p docs/architecture/c4/img
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            -v "$GITHUB_WORKSPACE:/workspace" \
            plantuml/plantuml:1.2026.9 \
            -tpng -o /workspace/docs/architecture/c4/img \
            /workspace/docs/architecture/c4/export/*.puml

      - name: Regenerar imágenes C4 de Mermaid
        run: |
          set -euo pipefail
          for mmd in docs/architecture/c4/export/*.mmd; do
            [ -e "$mmd" ] || continue
            mmdc -i "$mmd" \
              -o "docs/architecture/c4/img/$(basename "${mmd%.mmd}")-mermaid.png" \
              -p puppeteer.json -b white -s 2
          done
          plantuml_images="$(find docs/architecture/c4/img -maxdepth 1 -type f \
            -name 'structurizr-*.png' ! -name '*-mermaid.png' | wc -l)"
          mermaid_images="$(find docs/architecture/c4/img -maxdepth 1 -type f \
            -name 'structurizr-*-mermaid.png' | wc -l)"
          if [ "$plantuml_images" -ne 5 ] || [ "$mermaid_images" -ne 5 ]; then
            echo "::error::No se generaron las diez imágenes C4 esperadas; PlantUML=$plantuml_images, Mermaid=$mermaid_images"
            exit 1
          fi

      - name: Validar sintaxis de los .mmd
        run: |
          set -euo pipefail
          mkdir -p /tmp/validacion
          encontrado=0
          for mmd in docs/architecture/diagramas/*.mmd; do
            [ -e "$mmd" ] || continue
            encontrado=1
            echo "Validando $mmd"
            mmdc -i "$mmd" -o "/tmp/validacion/$(basename "${mmd%.mmd}").png" \
              -p puppeteer.json -b white
          done
          if [ "$encontrado" -eq 0 ]; then
            echo "No se encontro ningun archivo .mmd"
            exit 1
          fi
          echo "Todos los .mmd son validos"

      - name: Regenerar PNG
        if: github.event_name == 'push'
        run: |
          set -euo pipefail
          for mmd in docs/architecture/diagramas/*.mmd; do
            [ -e "$mmd" ] || continue
            mmdc -i "$mmd" \
              -o "docs/architecture/diagramas/img/$(basename "${mmd%.mmd}").png" \
              -p puppeteer.json -b white -s 2
            echo "Regenerado $mmd"
          done

      - name: Commit si las imagenes cambiaron
        if: github.event_name == 'push'
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/architecture/diagramas/img/ \
            docs/architecture/c4/export/ \
            docs/architecture/c4/img/
          if git diff --cached --quiet; then
            echo "Los diagramas no cambiaron: no se crea commit."
          else
            git commit -m "CI: regenerar diagramas C4 y Mermaid [skip ci]"
            git push
            echo "Diagramas regenerados y publicados."
          fi
