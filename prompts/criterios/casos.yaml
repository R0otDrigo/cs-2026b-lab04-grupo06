- description: "H7 no INVEST (ambigua)"
  vars:
    id: H7
    historia: "Como pasajero, quiero que la aplicación sea rápida y fácil de usar."
    caso: no_invest
    esperado: "invest_ok = false, al menos 1 pregunta y 0 escenarios (no inventar criterios)."
  assert:
    - type: javascript                  # A4: historia no INVEST -> rechazar con preguntas y 0 escenarios
      metric: A4_rechaza_no_invest
      value: |
        let j; try { j = JSON.parse(output); } catch (e) { return false; }
        return j.invest_ok === false && (j.preguntas || []).length >= 1 && (j.escenarios || []).length === 0;

